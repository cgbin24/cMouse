# 云端构建 Windows 接收端：单文件 exe（无驱动，无需管理员权限）
# 产物获取方式（二选一）：
#   1. Actions 运行页底部 Artifacts → cMouse-receiver-windows（保留 90 天，需登录）
#   2. 推送 v* 标签后自动发布到仓库 Releases 页（永久，无需登录）：
#      git tag v1.0.0 && git push origin v1.0.0
name: build-windows

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 不加 PublishTrimmed：裁剪与 SQLite 原生库组合存在运行时风险，先保证可靠出包
      - name: 发布单文件 exe
        run: >
          dotnet publish receivers/windows -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -o output

      - name: 整理产物与校验值
        shell: pwsh
        run: |
          Copy-Item output/cMouse.exe output/cMouse-receiver-win-x64.exe
          (Get-FileHash output/cMouse-receiver-win-x64.exe -Algorithm SHA256).Hash |
            Out-File -Encoding ascii output/SHA256SUMS-windows.txt
          Get-ChildItem output | Format-Table Name, Length

      - name: 构建产物（Actions 运行页 Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: cMouse-receiver-windows
          path: |
            output/cMouse-receiver-win-x64.exe
            output/SHA256SUMS-windows.txt

      - name: 发布到 Releases（仅当推送 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/cMouse-receiver-win-x64.exe
            output/SHA256SUMS-windows.txt
