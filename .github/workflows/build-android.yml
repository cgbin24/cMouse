# 云端构建 Android APK
# 产物获取方式（二选一）：
#   1. Actions 运行页底部 Artifacts → cMouse-debug-apk（保留 90 天，需登录）
#   2. 推送 v* 标签后自动发布到仓库 Releases 页（永久，无需登录）：
#      git tag v1.0.0 && git push origin v1.0.0
name: build-android

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # runner 预装了 Android SDK（ANDROID_HOME 已指向 /usr/local/lib/android/sdk），
      # 不使用 android-actions/setup-android@v3：该 Action 会尝试安装已下架的 tools 包导致失败
      - name: 安装 SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: 构建 Debug APK（自带调试签名，可直接安装）
        run: |
          set -o pipefail
          curl -sL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      # 失败时把编译错误汇总打到日志末尾，避免截图滚动找错
      - name: 输出编译错误摘要
        if: failure()
        run: |
          grep -E "e: |error: " /tmp/build.log | head -80 || echo "未找到 e:/error: 行，请查看 build-log 工件"

      - name: 上传完整构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: 构建日志附到 Release（失败时，供远程诊断）
        if: failure() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/build.log

      - name: 整理产物与校验值
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/cMouse-debug.apk
          sha256sum dist/cMouse-debug.apk | tee dist/SHA256SUMS-android.txt
          ls -lh dist

      - name: 构建产物（Actions 运行页 Artifacts，下载后需解压）
        uses: actions/upload-artifact@v4
        with:
          name: cMouse-debug-apk
          path: dist/cMouse-debug.apk

      - name: 发布到 Releases（仅当推送 v* 标签，直链原始 APK 无需解压）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cMouse-debug.apk
            dist/SHA256SUMS-android.txt
