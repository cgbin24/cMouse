# 云端构建 Android APK：推送到 GitHub 后自动产出可直接安装的 app-debug.apk
# 使用：仓库页 Actions → build-android → Run workflow，完成后在 Artifacts 下载
name: build-android

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/build-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: 构建 Debug APK（自带调试签名，可直接安装）
        run: |
          curl -sL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-8.10.2-bin.zip"
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cMouse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
